<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>GLB Loader</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import Hais from './hais';
import Haalga from './haalga';
import Hana from './hana';
import Mod from './tree';
import Tsonh from './tsonh';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000 );

const renderer = new THREE.WebGLRenderer();
renderer.setSize( window.innerWidth, window.innerHeight );
renderer.setAnimationLoop( animate );
document.body.appendChild( renderer.domElement );
const controls = new OrbitControls( camera, renderer.domElement );

const axesHelper = new THREE.AxesHelper( 20 );
scene.add( axesHelper );

const geometry = new THREE.PlaneGeometry( 100, 100 );
const material = new THREE.MeshBasicMaterial( { color: 0x09C862, side: THREE.DoubleSide } );
const plane = new THREE.Mesh( geometry, material );
scene.add( plane );
plane.rotation.x = Math.PI/2;

for(let i=0;i<15;i++){
    if(i === 14 || i === 15) continue;
    const h1 = new Hais({a:3,b:2,color:0x700505});
    h1.group.position.set(-21+i*3,0,15);
    scene.add(h1.group);
}
for(let i=0;i<10;i++){
    const h2 = new Hais({a:3,b:2,color:0x700505});
    h2.Rotate(-Math.PI/2)
    h2.group.position.set(-21,0,-15+i*3);
    scene.add(h2.group);
}
for(let i=0;i<11;i++){
    const h3 = new Hais({a:3,b:2,color:0xC80972});
    h3.group.position.set(-21,0,15-i*3);
    scene.add(h3.group);
}
for(let i=0;i<10;i++){
    const h2 = new Hais({a:3,b:2,color:0x700505});
    h2.Rotate(-Math.PI/2)
    h2.group.position.set(-18,0,-15+i*3);
    scene.add(h2.group);
}
for(let i=0;i<15;i++){
    const h1 = new Hais({a:3,b:2,color:0x700505});
    h1.group.position.set(-21+i*3,0,-15);
    scene.add(h1.group);
}
for(let i=0;i<10;i++){
    const h2 = new Hais({a:3,b:2,color:0x700505});
    h2.Rotate(-Math.PI/2)
    h2.group.position.set(24,0,-15+i*3);
    scene.add(h2.group);
}

const haalga = new Haalga({ a:3, b:2, x:21, y:0.75, z:15 });
scene.add(haalga.group);
haalga.group.position.y = 2 / 2;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
window.addEventListener("click", (event) => {

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObject(haalga.group, true);

    if (intersects.length > 0) {
        haalga.toggle();
    }

});
// Арын хана
const hanaBack = new Hana({x: 0, y: 2, z: -6.5, urgun: 10, undur: 4});
scene.add(hanaBack.group);
const windowBack = new Tsonh({x: 0, y: 0.5, z: 0.1});
hanaBack.group.add(windowBack.group);

// Урд хана 
const hanaFront = new Hana({x: 0, y: 2, z: 6.5, urgun: 10, undur: 4});
scene.add(hanaFront.group);
const windowFront = new Tsonh({x: 0, y: 0.5, z: 0.1});
hanaFront.group.add(windowFront.group);

// Зүүн хана
const hanaLeft = new Hana({x: -5, y: 2, z: 0, urgun: 13, undur: 4}); 
hanaLeft.Rotate(Math.PI / 2);
scene.add(hanaLeft.group);
const windowLeft = new Tsonh({x: 0, y: 0.5, z: 0.1});
hanaLeft.group.add(windowLeft.group);

// Баруун хана
const hanaRight = new Hana({x: 5, y: 2, z: 0, urgun: 13, undur: 4});
hanaRight.Rotate(Math.PI / 2);
scene.add(hanaRight.group);
const windowRight = new Tsonh({x: 0, y: 0.5, z: 0.1});
hanaRight.group.add(windowRight.group);

const tree1 = new Mod();
tree1.group.position.set(-19.5, 0, 13.5);
scene.add(tree1.group);

const tree2 = new Mod();
tree2.group.position.set(-19.5, 0, 10.5);
scene.add(tree2.group);

const tree3 = new Mod();
tree3.group.position.set(-19.5, 0, 7.5);
scene.add(tree3.group);

const tree4 = new Mod();
tree4.group.position.set(-19.5, 0, 4.5);
scene.add(tree4.group);

const tree5 = new Mod();
tree5.group.position.set(-19.5, 0, 1.5);
scene.add(tree5.group);

const tree6 = new Mod();
tree6.group.position.set(-19.5, 0, -1.5);
scene.add(tree6.group);

const tree7 = new Mod();
tree7.group.position.set(-19.5, 0, -4.5);
scene.add(tree7.group);

const tree8 = new Mod();
tree8.group.position.set(-19.5, 0, -7.5);
scene.add(tree8.group);

const tree9 = new Mod();
tree9.group.position.set(-19.5, 0, -10.5);
scene.add(tree9.group);

const tree10 = new Mod();
tree10.group.position.set(-19.5, 0, -13.5);
scene.add(tree10.group);
//baishingiin suuri
const floorGeometry = new THREE.BoxGeometry(10, 0.1, 13);
const floorMaterial = new THREE.MeshBasicMaterial({color: 0xA0522D });
const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.position.set(0,0,0);
scene.add(floor);

camera.position.z = 20;
controls.update();
function animate() {
    controls.update();
   renderer.render( scene, camera );

}

</script>
</body>
</html>
